<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Inscrições</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho">
        <div class="conteudo-cabecalho">
            <h1>Minhas inscrições</h1>
            <a href="index.html" id="link_inscricoes">
                Voltar às oficinas
            </a>
        </div>
    </header>
    <main class="conteudo-principal">
        <h2>
            Oficinas selecionadas
        </h2>
        <section id="lista_inscricoes" class="lista-inscricoes"></section>
        <section class="resumo-inscricoes">
            <p>
                Quantidade de oficinas:
                <strong id="quantidade_oficinas">0</strong>
            </p>
            <p>
                Valor total:
                <strong id="valor_total">
                    R$ 0,00
                </strong>
            </p>
            <a href="index.html" class="botao-voltar">Voltar às Oficinas</a>
        </section>
    </main>
    <script src="inscricoes.js"></script>
</body>
</html>
